<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="-apple-system, Helvetica, Arial, sans-serif"><rect width="760" height="230" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">How much more a channel responds to red than to green</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Share under red divided by share under green. Higher means a sharper red/green split.</text><text x="20" y="100" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">macOS 27.0.1</text><rect x="170" y="70" width="90.7" height="20" fill="#8c959f"/><text x="268.73770750764146" y="85" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1.5x  c3 share of c0..c3</text><rect x="170" y="96" width="197.8" height="20" fill="#d23b3b"/><text x="375.7795468413641" y="111" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">3.3x  c4 share of c0..c4</text><text x="20" y="172" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">macOS 27.2</text><rect x="170" y="142" width="97.4" height="20" fill="#8c959f"/><text x="275.4416201594722" y="157" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1.6x  c3 share of c0..c3</text><rect x="170" y="168" width="358.6" height="20" fill="#d23b3b"/><text x="536.6203978387628" y="183" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">6.0x  c4 share of c0..c4</text></svg>
