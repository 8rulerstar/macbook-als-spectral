<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, Helvetica, Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">How much more a channel responds to red than to green</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Share under red divided by share under green. Higher means a sharper red/green split.</text><text x="20" y="100" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">macOS 27.0.1</text><rect x="170" y="70" width="75.6" height="20" fill="#8c959f"/><text x="253.61475625636788" y="85" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1.5x  c3 share of c0..c3</text><rect x="170" y="96" width="164.8" height="20" fill="#d23b3b"/><text x="342.81628903447006" y="111" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">3.3x  c4 share of c0..c4</text><text x="20" y="172" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">macOS 27.2 run 1</text><rect x="170" y="142" width="81.2" height="20" fill="#8c959f"/><text x="259.2013501328935" y="157" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1.6x  c3 share of c0..c3</text><rect x="170" y="168" width="298.9" height="20" fill="#d23b3b"/><text x="476.85033153230233" y="183" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">6.0x  c4 share of c0..c4</text><text x="20" y="244" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">macOS 27.2 run 2</text><rect x="170" y="214" width="96.7" height="20" fill="#8c959f"/><text x="274.65091251716257" y="229" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1.9x  c3 share of c0..c3</text><rect x="170" y="240" width="371.8" height="20" fill="#d23b3b"/><text x="549.8075617229339" y="255" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">7.4x  c4 share of c0..c4</text></svg>
